<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sold Out · The Artisan Jen</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9973a;
      --gold-light: #f0c85a;
      --cream: #0a0a0a;
      --ink: #f5d98a;
      --muted: #c9a84c;
      --card-bg: #111111;
      --border: #2a2418;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── NAV ──────────────────────────────────────────── */
    nav.main-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      gap: 38px;
      padding: 18px 24px;
      background: rgba(10,10,10,.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav.main-nav a {
      font-family: 'Lato', sans-serif;
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      position: relative;
      padding: 4px 0;
      transition: color .25s;
    }
    nav.main-nav a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1px;
      background: var(--gold);
      transition: width .3s ease;
    }
    nav.main-nav a:hover { color: var(--gold-light); }
    nav.main-nav a:hover::after, nav.main-nav a.active::after { width: 100%; }
    nav.main-nav a.active { color: var(--gold-light); }

    /* ── HERO ─────────────────────────────────────────── */
    header {
      position: relative;
      background: url('bg.jpg') center 55% / 160% auto no-repeat;
      overflow: hidden;
      padding: 80px 24px 64px;
      text-align: center;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.40) 60%,
        rgba(0, 0, 0, 0.50) 100%
      );
      pointer-events: none;
    }

    .ornament {
      display: block;
      font-size: 22px;
      letter-spacing: .35em;
      color: var(--gold);
      margin-bottom: 18px;
      opacity: .85;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #ffffff;
      text-shadow:
        0 0 2px #000, 0 0 2px #000, 0 0 2px #000,
        1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
        0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7);
      -webkit-font-smoothing: antialiased;
      line-height: 1.15;
      letter-spacing: .04em;
    }

    header h1 em {
      font-style: italic;
      color: #fff176;
      text-shadow:
        0 0 2px #000, 0 0 2px #000,
        1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000,
        0 0 20px rgba(255,230,80,1), 0 0 50px rgba(255,200,0,0.9);
    }

    .tagline {
      margin-top: 16px;
      font-size: .85rem;
      font-weight: 300;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 2px #000, 0 0 2px #000, 1px 1px 0 #000, -1px -1px 0 #000, 0 0 15px rgba(0,0,0,0.9);
    }

    .divider-gold {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 28px auto 0;
    }

    /* ── INTRO ────────────────────────────────────────── */
    .intro {
      max-width: 620px;
      margin: 56px auto 0;
      padding: 0 24px;
      text-align: center;
    }

    .intro p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 300;
      font-style: italic;
      color: #c9a84c;
      line-height: 1.75;
    }

    /* ── TABS ─────────────────────────────────────────── */
    .tabs {
      max-width: 1080px;
      margin: 48px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 26px;
      border-radius: 999px;
      font-family: 'Lato', sans-serif;
      font-size: .8rem;
      font-weight: 400;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      transition: background .22s, color .22s, border-color .22s;
    }

    .tab:hover {
      color: var(--gold-light);
      border-color: var(--gold);
    }

    .tab.active {
      background: var(--gold-light);
      color: #0a0a0a;
      border-color: var(--gold-light);
      font-weight: 600;
    }

    .tab .count {
      margin-left: 6px;
      opacity: .7;
      font-weight: 300;
    }

    .tab.active .count { opacity: .8; }

    /* ── GRID ─────────────────────────────────────────── */
    .workshops {
      max-width: 1080px;
      margin: 32px auto 40px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 28px;
    }

    /* ── CARD ─────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 36px 32px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      transition: box-shadow .25s, transform .25s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-light), var(--gold), var(--gold-light));
      opacity: 0;
      transition: opacity .25s;
    }

    .card:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
      transform: translateY(-3px);
    }

    .card:hover::before { opacity: 1; }

    .card-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: .72rem;
      letter-spacing: .25em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.4;
      color: #ffe082;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: .82rem;
      color: var(--muted);
      font-weight: 300;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .meta-icon {
      flex-shrink: 0;
      width: 16px;
      margin-top: 1px;
      opacity: .6;
    }

    .meta-row a {
      color: var(--muted);
      text-decoration: none;
    }

    .sep {
      height: 1px;
      background: var(--border);
    }

    .btn-sold-out {
      display: inline-block;
      margin-top: auto;
      padding: 11px 24px;
      border: 1px solid #888;
      color: #888;
      font-family: 'Lato', sans-serif;
      font-size: .75rem;
      font-weight: 400;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-decoration: none;
      text-align: center;
      cursor: default;
      pointer-events: none;
    }

    .card-promo {
      width: 100%;
      margin-top: 18px;
      border-radius: 4px;
      overflow: hidden;
      display: block;
    }

    .card-promo img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── FOOTER ───────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
    }

    footer p {
      font-size: .75rem;
      letter-spacing: .12em;
      color: rgba(201,168,76,.4);
      text-transform: uppercase;
    }

    /* ── RESPONSIVE ───────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 28px 22px 24px; }
    }
  </style>
</head>
<body>

  <nav class="main-nav">
    <a href="index.html">Workshops</a>
    <a href="portfolio.html">Portfolio</a>
  </nav>

  <header>
    <span class="ornament">✦ &nbsp; ✦ &nbsp; ✦</span>
    <h1>Sold <em>Out</em></h1>
    <p class="tagline">Traditional Chinese Jewelry Arts · Seattle &amp; Everett</p>
    <div class="divider-gold"></div>
  </header>

  <div class="intro">
    <p>No workshops are sold out right now — check Upcoming for sessions with places still open.</p>
  </div>

  <nav class="tabs">
    <a class="tab" href="index.html">Upcoming <span class="count">6</span></a>
    <a class="tab active" href="soldout.html">Sold Out <span class="count">0</span></a>
    <a class="tab" href="past.html">Past Events <span class="count">8</span></a>
  </nav>

  <section class="workshops"></section>

  <footer>
    <p>Seattle, WA &nbsp;·&nbsp; 2026</p>
  </footer>

</body>
</html>
